<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="55%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="ring" x1="280" y1="240" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="beam" x1="512" y1="560" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 300) rotate(90) scale(180)">
      <stop stop-color="#00e5a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="208" stroke="url(#ring)" stroke-width="4" opacity="0.55"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#00e5a0" stroke-width="2">
    <path d="M512 180V844M180 512H844"/>
    <circle cx="512" cy="512" r="220"/>
    <circle cx="512" cy="512" r="320"/>
  </g>

  <!-- Scope ring -->
  <circle cx="512" cy="512" r="300" stroke="url(#ring)" stroke-width="6" opacity="0.45"/>
  <circle cx="512" cy="512" r="220" stroke="#00d4ff" stroke-width="2" opacity="0.18"/>

  <!-- Outer sweep arc -->
  <path
    d="M512 512V180A332 332 0 0 1 780 320"
    stroke="#00e5a0"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.35"
  />

  <!-- Active sweep -->
  <path
    d="M512 512V260A252 252 0 0 1 720 360"
    stroke="#00e5a0"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Sweep beam -->
  <path
    d="M512 512L760 300"
    stroke="url(#beam)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Detection ping glow -->
  <circle cx="760" cy="300" r="120" fill="url(#glow)"/>
  <circle cx="760" cy="300" r="34" fill="#00e5a0" filter="url(#softGlow)"/>
  <circle cx="760" cy="300" r="58" stroke="#00d4ff" stroke-width="5" opacity="0.75"/>

  <!-- Reticle -->
  <circle cx="512" cy="512" r="16" fill="#00d4ff"/>
  <path
    d="M512 420V470M512 554V604M420 512H470M554 512H604"
    stroke="#00d4ff"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- Ticker accent line -->
  <rect x="300" y="760" width="424" height="8" rx="4" fill="#fff200" opacity="0.85"/>
  <rect x="300" y="760" width="180" height="8" rx="4" fill="#fff200"/>
</svg>
